<!DOCTYPE html>
<html>
<head>
  <title>PIN Hash Test</title>
</head>
<body>
  <h1>PIN Hash Tester</h1>
  <input type="text" id="pinInput" placeholder="Enter PIN">
  <button onclick="hashPin()">Hash PIN</button>
  <div id="result"></div>

  <script>
    async function hashPin() {
      const pin = document.getElementById('pinInput').value;
      const encoder = new TextEncoder();
      const data = encoder.encode(pin);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const pinHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

      document.getElementById('result').innerHTML = `
        <p><strong>PIN:</strong> ${pin}</p>
        <p><strong>Hash:</strong> ${pinHash}</p>
        <p><strong>Expected:</strong> 61503690505f84b144e6ac89124540a3eb8d22e77db76500984cfc50a1d8776e</p>
        <p><strong>Match:</strong> ${pinHash === '61503690505f84b144e6ac89124540a3eb8d22e77db76500984cfc50a1d8776e' ? 'YES ✓' : 'NO ✗'}</p>
      `;
    }
  </script>
</body>
</html>
