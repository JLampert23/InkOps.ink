<!DOCTYPE html>
<html>
<head>
    <title>Test Resend Key Decryption</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Test Resend API Key Decryption</h1>
    <button onclick="testDecryption()">Test Decryption</button>
    <pre id="result"></pre>

    <script>
        const supabaseUrl = 'https://cuaukcvccxvfpuxaciac.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1YXVrY3ZjY3h2ZnB1eGFjaWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1NjA4NTQsImV4cCI6MjA4MjEzNjg1NH0.I-FDsR0oezVPxKcWgFmV-MMolV6E-lYcoA7Ew8ZgKYU';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function testDecryption() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Testing...\n';

            try {
                // Login first (replace with your credentials)
                const email = prompt('Enter your email:');
                const password = prompt('Enter your password:');

                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (authError) {
                    resultDiv.textContent += `Auth error: ${authError.message}\n`;
                    return;
                }

                resultDiv.textContent += `Logged in successfully\n\n`;

                // Get company settings
                const { data: settings, error: settingsError } = await supabase
                    .from('company_settings')
                    .select('resend_api_key, email_from_address')
                    .single();

                if (settingsError) {
                    resultDiv.textContent += `Settings error: ${settingsError.message}\n`;
                    return;
                }

                resultDiv.textContent += `Encrypted key length: ${settings.resend_api_key?.length || 0}\n`;
                resultDiv.textContent += `From address: ${settings.email_from_address}\n\n`;

                // Try to decrypt
                const { data: { session } } = await supabase.auth.getSession();

                const response = await fetch(`${supabaseUrl}/functions/v1/crypto-service`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${session.access_token}`,
                    },
                    body: JSON.stringify({
                        action: 'decrypt',
                        token: settings.resend_api_key,
                    }),
                });

                const decryptResult = await response.json();

                if (decryptResult.success) {
                    const decryptedKey = decryptResult.result;
                    resultDiv.textContent += `Decrypted key: ${decryptedKey.substring(0, 10)}...\n`;
                    resultDiv.textContent += `Key starts with 're_': ${decryptedKey.startsWith('re_')}\n`;
                } else {
                    resultDiv.textContent += `Decryption failed: ${decryptResult.error}\n`;
                }

            } catch (error) {
                resultDiv.textContent += `Error: ${error.message}\n`;
            }
        }
    </script>
</body>
</html>
