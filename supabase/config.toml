
[functions.create-subscription-checkout]
enabled = true
verify_jwt = false
import_map = "./functions/create-subscription-checkout/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-subscription-checkout/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-subscription-checkout/*.html" ]

[functions.inkops-stripe-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/inkops-stripe-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/inkops-stripe-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/inkops-stripe-webhook/*.html" ]

[functions.quote-actions]
enabled = true
verify_jwt = false
entrypoint = "./functions/quote-actions/index.ts"

# Public-facing functions hit by customers (no auth header) — every one of these
# MUST have verify_jwt = false or Supabase's gateway returns
# "UNAUTHORIZED_NO_AUTH_HEADER" before our code runs. Adding here so future
# `supabase functions deploy <name>` calls don't need --no-verify-jwt to work.

[functions.quote-approval]
enabled = true
verify_jwt = false
entrypoint = "./functions/quote-approval/index.ts"

[functions.verify-magic-link]
enabled = true
verify_jwt = false
entrypoint = "./functions/verify-magic-link/index.ts"

[functions.send-magic-link]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-magic-link/index.ts"

[functions.set-customer-password]
enabled = true
verify_jwt = false
entrypoint = "./functions/set-customer-password/index.ts"

[functions.verify-customer-password]
enabled = true
verify_jwt = false
entrypoint = "./functions/verify-customer-password/index.ts"

[functions.request-password-reset]
enabled = true
