[functions.stripe-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/stripe-webhook/index.ts"

# Internal-call-only function. Called by process-automation-queue with the
# service role key. Supabase's gateway rejects the new sb_secret_... key
# format as UNAUTHORIZED_INVALID_JWT_FORMAT when verify_jwt = true, breaking
# every automation email. send-email does its own auth check internally
# (bearerToken === SUPABASE_SERVICE_ROLE_KEY), so disabling gateway JWT
# verification is safe.
[functions.send-email]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-email/index.ts"

# Internal-call-only worker. Called by send-email (and other server-side
# functions) to encrypt/decrypt sensitive tokens like the Resend API key.
# Same gateway JWT issue: caller passes the service role key, gateway
# rejects "missing sub claim". Function security is via ENCRYPTION_KEY
# env var, not gateway-level auth — disabling verify_jwt is safe.
[functions.crypto-service]
enabled = true
verify_jwt = false
entrypoint = "./functions/crypto-service/index.ts"
