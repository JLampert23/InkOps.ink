<!DOCTYPE html>
<html>
<head>
    <title>Resend API Diagnostic</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: monospace; padding: 20px; max-width: 800px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; overflow-x: auto; }
        input { padding: 8px; width: 400px; margin: 5px; }
        .step { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Resend API Diagnostic Tool</h1>

    <div class="step">
        <h2>Step 1: Login</h2>
        <input type="email" id="email" placeholder="Your email" />
        <input type="password" id="password" placeholder="Your password" />
        <button onclick="login()">Login</button>
        <pre id="loginResult"></pre>
    </div>

    <div class="step">
        <h2>Step 2: Check Current Settings</h2>
        <button onclick="checkSettings()">Check Current Settings</button>
        <pre id="settingsResult"></pre>
    </div>

    <div class="step">
        <h2>Step 3: Save New API Key</h2>
        <input type="text" id="apiKey" placeholder="Paste your Resend API key (starts with re_)" />
        <input type="text" id="fromEmail" placeholder="From email address" />
        <button onclick="saveKey()">Save Key</button>
        <pre id="saveResult"></pre>
    </div>

    <div class="step">
        <h2>Step 4: Test Sending Email</h2>
        <input type="email" id="testEmail" placeholder="Test recipient email" />
        <button onclick="sendTest()">Send Test Email</button>
        <pre id="testResult"></pre>
    </div>

    <script>
        const supabaseUrl = 'https://cuaukcvccxvfpuxaciac.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1YXVrY3ZjY3h2ZnB1eGFjaWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1NjA4NTQsImV4cCI6MjA4MjEzNjg1NH0.I-FDsR0oezVPxKcWgFmV-MMolV6E-lYcoA7Ew8ZgKYU';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let session = null;

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('loginResult');

            result.textContent = 'Logging in...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) throw error;

                session = data.session;
                result.innerHTML = `<span class="success">✓ Logged in successfully!</span>\nUser ID: ${data.user.id}`;
            } catch (error) {
                result.innerHTML = `<span class="error">✗ Login failed: ${error.message}</span>`;
            }
        }

        async function checkSettings() {
            const result = document.getElementById('settingsResult');

            if (!session) {
                result.innerHTML = '<span class="error">Please login first</span>';
                return;
            }

            result.textContent = 'Checking...';

            try {
                const { data, error } = await supabase
                    .from('company_settings')
                    .select('id, resend_api_key, email_from_address')
                    .single();

                if (error) throw error;

                const hasKey = data.resend_api_key !== null && data.resend_api_key !== '';
                const hasEmail = data.email_from_address !== null && data.email_from_address !== '';

                result.innerHTML = `
Company Settings ID: ${data.id}

Resend API Key: ${hasKey ? '<span class="success">✓ Saved (encrypted)</span>' : '<span class="error">✗ Not saved</span>'}
${hasKey ? `Length: ${data.resend_api_key.length} characters` : ''}

From Email: ${hasEmail ? `<span class="success">✓ ${data.email_from_address}</span>` : '<span class="error">✗ Not set</span>'}
                `;
            } catch (error) {
                result.innerHTML = `<span class="error">✗ Error: ${error.message}</span>`;
            }
        }

        async function saveKey() {
            const apiKey = document.getElementById('apiKey').value;
            const fromEmail = document.getElementById('fromEmail').value;
            const result = document.getElementById('saveResult');

            if (!session) {
                result.innerHTML = '<span class="error">Please login first</span>';
                return;
            }

            if (!apiKey || !apiKey.startsWith('re_')) {
                result.innerHTML = '<span class="error">Invalid API key. Must start with re_</span>';
                return;
            }

            if (!fromEmail) {
                result.innerHTML = '<span class="error">From email is required</span>';
                return;
            }

            result.textContent = 'Encrypting and saving...';

            try {
                // Step 1: Encrypt the key
                result.textContent = 'Step 1: Encrypting API key...';
                const encryptResponse = await fetch(`${supabaseUrl}/functions/v1/crypto-service`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${session.access_token}`,
                    },
                    body: JSON.stringify({
                        action: 'encrypt',
                        token: apiKey,
                    }),
                });

                if (!encryptResponse.ok) {
                    const errorData = await encryptResponse.json();
                    throw new Error(errorData.error || 'Failed to encrypt key');
                }

                const { result: encryptedKey } = await encryptResponse.json();

                // Step 2: Save to database
                result.textContent = 'Step 2: Saving to database...';
                const { error } = await supabase
                    .from('company_settings')
                    .update({
                        resend_api_key: encryptedKey,
                        email_from_address: fromEmail
                    })
                    .eq('id', (await supabase.from('user_profiles').select('company_id').single()).data.company_id);

                if (error) throw error;

                result.innerHTML = '<span class="success">✓ API key saved successfully!</span>';

                // Clear the input
                document.getElementById('apiKey').value = '';

                // Recheck settings
                checkSettings();
            } catch (error) {
                result.innerHTML = `<span class="error">✗ Error: ${error.message}</span>`;
            }
        }

        async function sendTest() {
            const testEmail = document.getElementById('testEmail').value;
            const result = document.getElementById('testResult');

            if (!session) {
                result.innerHTML = '<span class="error">Please login first</span>';
                return;
            }

            if (!testEmail) {
                result.innerHTML = '<span class="error">Test email is required</span>';
                return;
            }

            result.textContent = 'Sending test email...';

            try {
                const response = await fetch(`${supabaseUrl}/functions/v1/send-email`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${session.access_token}`,
                    },
                    body: JSON.stringify({
                        to: testEmail,
                        subject: 'Test Email from Diagnostic Tool',
                        html: '<p>This is a test email sent from the diagnostic tool.</p>',
                    }),
                });

                const data = await response.json();

                if (data.success) {
                    result.innerHTML = `<span class="success">✓ Email sent successfully!</span>\n${JSON.stringify(data, null, 2)}`;
                } else {
                    result.innerHTML = `<span class="error">✗ Failed to send email:</span>\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                result.innerHTML = `<span class="error">✗ Error: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
