<!DOCTYPE html>
<html>
<head>
  <title>SanMar Raw Response Test</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    button { padding: 10px 20px; margin: 10px 0; }
    #output { background: #f5f5f5; padding: 15px; white-space: pre-wrap; word-wrap: break-word; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h1>SanMar Raw Response Test</h1>

  <div>
    <label>Style Number: <input type="text" id="style" value="PC61" /></label>
  </div>

  <div>
    <label>Company ID: <input type="text" id="companyId" value="5f36fe64-8b67-4b62-a023-29590da87c41" /></label>
  </div>

  <button onclick="testSanMar()">Test SanMar API</button>

  <div id="output"></div>

  <script>
    async function testSanMar() {
      const style = document.getElementById('style').value;
      const companyId = document.getElementById('companyId').value;
      const output = document.getElementById('output');

      output.innerHTML = 'Loading...';

      try {
        const url = `https://cuaukcvccxvfpuxaciac.supabase.co/functions/v1/test-sanmar-endpoint?style=${encodeURIComponent(style)}&company_id=${encodeURIComponent(companyId)}`;

        console.log('Calling:', url);

        const response = await fetch(url);
        const data = await response.json();

        output.innerHTML = JSON.stringify(data, null, 2);

        // Highlight key info
        if (data.hasFault) {
          output.innerHTML = '<span class="error">SOAP FAULT DETECTED</span>\n\n' + output.innerHTML;
        } else if (data.hasError) {
          output.innerHTML = '<span class="error">ERROR DETECTED</span>\n\n' + output.innerHTML;
        } else if (data.partMatches > 0) {
          output.innerHTML = `<span class="success">Found ${data.partMatches} parts!</span>\n\n` + output.innerHTML;
        } else {
          output.innerHTML = '<span class="error">No parts found</span>\n\n' + output.innerHTML;
        }
      } catch (error) {
        output.innerHTML = `<span class="error">Error: ${error.message}</span>`;
        console.error(error);
      }
    }
  </script>
</body>
</html>
